services:
  - type: web
    name: cbb-analytics-hub
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: CBB_ADMIN_TOKEN
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: atg575/cbb-stats-sim
      - key: CBB_AUTO_GIT_PUSH
        value: "true"
