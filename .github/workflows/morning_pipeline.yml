name: Morning CBB Pull, Sim & Site Build

on:
  schedule:
    # Daily at 8:05 AM Eastern (handles EST/EDT automatically)
    - cron: '5 8 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  morning-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/New_York

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python & Playwright dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 1. Run batch_pull.py
        env:
          KENPOM_EMAIL: ${{ secrets.KENPOM_EMAIL }}
          KENPOM_PASSWORD: ${{ secrets.KENPOM_PASSWORD }}
          EVANMIYA_EMAIL: ${{ secrets.EVANMIYA_EMAIL }}
          EVANMIYA_PASSWORD: ${{ secrets.EVANMIYA_PASSWORD }}
        run: python3 batch_pull.py

      - name: 2. Run batch_sim.py for today's slate
        run: python3 batch_sim.py

      - name: 3. Build docs/data.json (full sync)
        run: python3 build_pages_site.py

      - name: 4. Commit & push updates to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stats_master.json data/sims/ docs/data.json docs/rank_history.json
          if ! git diff --cached --quiet; then
            git commit -m "Morning CBB update ($(date '+%Y-%m-%d'))"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit; skipping push."
          fi