name: Hourly CBB Results Grading

on:
  schedule:
    # Every hour at :15 from 12:15 PM ET through 2:15 AM ET
    - cron: '15 12-23,0-2 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grade-results:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: America/New_York

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install lightweight dependencies
        run: pip install pandas requests beautifulsoup4

      - name: 1. Run batch_result.py
        run: python3 batch_result.py

      - name: 2. Rebuild docs/data.json (skip slow external bracketology/poll sync)
        env:
          SKIP_BRACKETOLOGY_SYNC: "1"
        run: python3 build_pages_site.py

      - name: 3. Commit & push only if results changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sims/ docs/data.json docs/rank_history.json
          if ! git diff --cached --quiet; then
            git commit -m "Hourly game grading ($(date '+%Y-%m-%d %I:%M %p %Z'))"
            git pull --rebase origin main
            git push origin main
          else
            echo "No newly completed games; skipping push."
          fi