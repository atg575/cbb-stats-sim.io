name: Automated CBB Pipeline

on:
  schedule:
    # 1. Morning Run at 7:00 AM EST (12:00 UTC): Scrape stats -> Recalculate Worksheet -> Run Sim
    - cron: '0 12 * * *'
    # 2. Hourly Night Grader from 7:00 PM EST to 2:00 AM EST (00:00 - 07:00 UTC)
    - cron: '0 0-7 * * *'
  workflow_dispatch:
    inputs:
      job_type:
        description: 'Which job to run manually?'
        required: true
        default: 'morning_sim'
        type: choice
        options:
          - morning_sim
          - hourly_grader

permissions:
  contents: write

jobs:
  cbb-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Libraries & Headless Browser
        run: |
          pip install pandas openpyxl requests beautifulsoup4 lxml playwright
          playwright install --with-deps chromium

      # 7:00 AM EST JOB: Scrape all sites, recalculate Worksheet formulas, and run simulations
      - name: Morning Scrape, Formula Recalculation & Batch Simulation
        if: github.event.schedule == '0 12 * * *' || (github.event_name == 'workflow_dispatch' && inputs.job_type == 'morning_sim')
        run: |
          sudo apt-get update && sudo apt-get install -y libreoffice-calc
          python batch_pull.py
          
          # Safely recalculate Excel formulas without file-locking errors
          mkdir -p temp_calc
          libreoffice --headless --convert-to xlsx --outdir temp_calc "2026-27 Men's College Basketball Stats_code.xlsx"
          mv temp_calc/*.xlsx "2026-27 Men's College Basketball Stats_code.xlsx"
          rm -rf temp_calc
          
          python batch_sim.py

      # 7:00 PM - 2:00 AM EST JOB: Pull finished scores from Warren Nolan & grade models
      - name: Hourly Actual Score & Accuracy Grader
        if: (github.event.schedule != '0 12 * * *' && github.event_name == 'schedule') || (github.event_name == 'workflow_dispatch' && inputs.job_type == 'hourly_grader')
        run: |
          python batch_result.py

      - name: Rebuild GitHub Pages dashboard
        run: python3 build_pages_site.py

      - name: Save Updated Excel Files Back to GitHub
        run: |
          git config user.name "CBB-Auto-Bot"
          git config user.email "bot@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Auto-update CBB spreadsheets and simulation results"
          git pull --rebase origin main || true
          git push

      # Sync both spreadsheets directly to your Google Drive folder
      - name: Sync Excel Files to Google Drive
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: |
          sudo apt-get install -y rclone
          rclone copy "2026-27 Men's College Basketball Stats_code.xlsx" gdrive:CBB_Sim_Cloud/
          rclone copy "Batch_Simulation_Results.xlsx" gdrive:CBB_Sim_Cloud/
